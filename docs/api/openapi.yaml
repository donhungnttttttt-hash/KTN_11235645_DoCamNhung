components:
  securitySchemes:
    sessionCookie: { type: apiKey, in: cookie, name: TMS_SESSION }
    csrfHeader: { type: apiKey, in: header, name: X-CSRF-TOKEN }
  schemas:
    Csrf:
      type: object
      required: [token, headerName]
      properties:
        token: { type: string }
        headerName: { type: string, example: X-CSRF-TOKEN }
    Me:
      type: object
      required: [id, username, displayName, roles, permissions, sessionExpiresAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        roles: { type: array, items: { type: string, enum: [ADMIN, PM, TESTER, DEV] } }
        permissions: { type: array, items: { type: string, enum: ['profile:read', 'users:read', 'users:create', 'users:update', 'users:delegate'] } }
        sessionExpiresAt: { type: string, format: date-time }
    User:
      type: object
      required: [id, username, displayName, role, enabled, canCreateUsers, version, createdAt]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [ADMIN, PM, TESTER, DEV] }
        enabled: { type: boolean }
        canCreateUsers: { type: boolean, description: Cờ cấp riêng cho PM; ADMIN có quyền từ role dù cờ này false. }
        version: { type: integer, format: int64, minimum: 0 }
        createdAt: { type: string, format: date-time }
    Check:
      type: object
      required: [id, message, createdAt]
      properties:
        id: { type: string, format: uuid }
        message: { type: string, maxLength: 160 }
        createdAt: { type: string, format: date-time }
    ApiError:
      type: object
      required: [code, message, fieldErrors, requestId]
      properties:
        code: { type: string, example: VALIDATION_ERROR }
        message: { type: string, example: 'Vui lòng kiểm tra dữ liệu nhập.' }
        requestId: { type: string }
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, code, message]
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
  responses:
    Health:
      description: Trạng thái health tối thiểu; đây là payload Actuator, không phải ApiError.
      content:
        application/json:
          schema:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [UP, DOWN, OUT_OF_SERVICE, UNKNOWN] }
              groups:
                type: array
                items: { type: string }
    Error:
      description: |
        400 INVALID_REQUEST; 401 UNAUTHENTICATED/AUTHENTICATION_FAILED; 403 FORBIDDEN/CSRF_INVALID;
        404 NOT_FOUND; 409 VERSION_CONFLICT/USERNAME_EXISTS/SELF_DISABLE;
        422 VALIDATION_ERROR; 429 LOGIN_THROTTLED; 500 INTERNAL_ERROR; 503 DATABASE_UNAVAILABLE.
        Không trả stack trace, SQL hoặc credentials. API chưa mở trả 401 khi chưa đăng nhập, 403 khi đã đăng nhập.
        X-Request-ID hợp lệ được truyền lại; giá trị sai hoặc thiếu được thay bằng UUID.
      headers:
        X-Request-ID:
          schema: { type: string }
          description: Mã đối chiếu request/log; có cả trên response thành công.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
