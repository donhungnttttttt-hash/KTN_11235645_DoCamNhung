openapi: 3.0.3
info:
  title: SY Partners TMS — Sprint 01–10
  version: 0.10.1
  description: |
    Contract foundation S01 và identity nội bộ S02. Cookie session + CSRF cùng origin.
    /api/v1/system/** chỉ được đăng ký/cho phép ở profile local, backend bind loopback.
    Quyền tạo tài khoản chỉ cho ADMIN hoặc PM được ADMIN cấp; PM chỉ tạo TESTER.
servers:
  - url: http://127.0.0.1:8080
    description: Backend local (giao diện dùng proxy cùng origin 5173)
# Central administration contracts:
# ./admin.openapi.yaml (overview), ./admin-management.openapi.yaml (projects/users),
# ./device-inventory.openapi.yaml (physical inventory), ./admin-reporting.openapi.yaml (PM reports/audit).
paths:
  /api/v1/auth/csrf:
    get:
      operationId: authCsrf
      description: Public; lấy token CSRF và cookie session. Sau login/logout lấy token mới.
      responses:
        '200':
          description: Token CSRF, không phải token đăng nhập
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Csrf' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/login:
    post:
      operationId: login
      description: 5 lần/username/phút và 30 lần/IP/phút, gồm thành công; session ID và CSRF được đổi khi đăng nhập.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 1, maxLength: 64 }
                password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }
      responses:
        '200':
          description: Đã đăng nhập; cookie TMS_SESSION HttpOnly, SameSite Strict, Secure trên HTTPS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429':
          description: Quá nhiều lần thử
          headers:
            Retry-After: { schema: { type: integer, example: 60 } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiError' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/auth/logout:
    post:
      operationId: logout
      description: Hủy phiên trên server; idempotent khi có CSRF hợp lệ. Không tự retry POST nếu lỗi mạng.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      responses:
        '204': { description: Đã đăng xuất }
        '403': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/me:
    get:
      operationId: currentUser
      security: [{ sessionCookie: [] }]
      responses:
        '200':
          description: Profile và quyền của tài khoản đang đăng nhập, chưa có membership dự án
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/users:
    get:
      operationId: listUsers
      description: Chỉ ADMIN; sắp createdAt ASC, id ASC.
      security: [{ sessionCookie: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 0, default: 0 } }
        - { in: query, name: size, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Danh sách tài khoản
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, totalElements]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/User' } }
                  page: { type: integer }
                  size: { type: integer }
                  totalElements: { type: integer, format: int64 }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
    post:
      operationId: createUser
      description: ADMIN tạo ADMIN/PM/TESTER/DEV. PM có users:create chỉ tạo TESTER. TESTER và PM chưa được cấp luôn 403. PM mới mặc định chưa được cấp quyền.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, displayName, password, role]
              properties:
                username: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,63}$' }
                displayName: { type: string, minLength: 1, maxLength: 100 }
                password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
                role: { type: string, enum: [ADMIN, PM, TESTER, DEV] }
      responses:
        '201':
          description: Đã tạo tài khoản
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /api/v1/users/{id}:
    patch:
      operationId: updateUser
      description: Chỉ ADMIN. Cần enabled hoặc canCreateUsers; canCreateUsers chỉ áp dụng với PM. Thay đổi thu hồi mọi phiên của người được cập nhật. Không tự vô hiệu hóa tài khoản; không đổi role/password tại đây.
      security: [{ sessionCookie: [], csrfHeader: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                enabled: { type: boolean }
                canCreateUsers: { type: boolean }
                expectedVersion: { type: integer, format: int64, minimum: 0 }
      responses:
        '200':
          description: Đã cập nhật, version mới trong response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }
  /actuator/health:
    get:
      operationId: health
      responses:
        '200':
          $ref: '#/components/responses/Health'
        '503':
          $ref: '#/components/responses/Health'
  /actuator/health/readiness:
    get:
      operationId: readiness
      description: UP khi ứng dụng chấp nhận request và datasource kết nối được MySQL; không trả chi tiết cấu hình.
      responses:
        '200':
          $ref: '#/components/responses/Health'
        '503':
          $ref: '#/components/responses/Health'
  /api/v1/system/status:
    get:
      operationId: systemStatus
      description: Local only; đọc application_info, phiên bản MySQL và lịch sử Flyway thực tế.
      responses:
        '200':
          description: Kết nối thành công
          content:
            application/json:
              schema:
                type: object
                required: [status, application, database, migrationVersion, appliedMigrations, installedAt, checkedAt]
                properties:
                  status: { type: string, enum: [UP] }
                  application: { type: string }
                  database: { type: string, example: 'MySQL 8.4.8' }
                  migrationVersion: { type: string, example: '1' }
                  appliedMigrations: { type: integer, minimum: 1 }
                  installedAt: { type: string, format: date-time }
                  checkedAt: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /api/v1/system/csrf:
    get:
      operationId: localCsrf
      description: Local only; tạo token CSRF và cookie session HttpOnly. Gửi cookie cùng token trong POST tiếp theo.
      responses:
        '200':
          description: Token bảo vệ request; không phải token đăng nhập
          content:
            application/json:
              schema:
                type: object
                required: [token, headerName]
                properties:
                  token: { type: string }
                  headerName: { type: string, example: X-CSRF-TOKEN }
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/system/checks:
    get:
      operationId: listFoundationChecks
      description: Local only. Trang cố định 0, tối đa 20 bản ghi mới nhất, sắp createdAt DESC rồi id DESC. Chưa nhận tham số phân trang.
      responses:
        '200':
          description: Danh sách kiểm tra (có thể rỗng)
          content:
            application/json:
              schema:
                type: object
                required: [items, page, size, totalElements]
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items: { $ref: '#/components/schemas/Check' }
                  page: { type: integer, enum: [0] }
                  size: { type: integer, enum: [20] }
                  totalElements: { type: integer, format: int64, minimum: 0 }
        '401':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      operationId: createFoundationCheck
      description: |
        Local only. Nội dung bắt buộc, tối đa 160 UTF-16 code units trước trim;
        bỏ khoảng trắng đầu/cuối khi lưu. Giao dịch tạo một bản ghi UUID và thời gian UTC.
        Chưa có idempotency key: client không tự retry POST; kiểm tra danh sách trước khi gửi lại nếu mất kết nối.
      parameters:
        - in: header
          name: X-CSRF-TOKEN
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 160, example: 'Kiểm tra kết nối từ giao diện' }
      responses:
        '201':
          description: Đã ghi thành công vào MySQL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Check' }
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
