<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900"><title>Điều hướng màn hình hiện hành</title><desc>AppEntry; AppRouter; AdminApp. Đây là bản đồ điều hướng không phải ảnh chụp UI hoặc bằng chứng bấm nút.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="390" y="20" width="320" height="75" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="550" y="50" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Shell sau đăng nhập</text><rect x="25" y="170" width="320" height="90" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="185" y="200" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">ADMIN</text><text x="185" y="228" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">/admin</text><rect x="390" y="170" width="320" height="110" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="550" y="200" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Workspace dự án</text><text x="550" y="228" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">PM / TESTER / DEV</text><text x="550" y="256" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">ADMIN chủ động mở</text><rect x="755" y="170" width="320" height="90" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="915" y="200" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Chat riêng</text><text x="915" y="228" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Có ở cả hai không gian</text><path d="M550,95 L185,170" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><path d="M550,95 L550,170" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><path d="M550,95 L920,170" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><rect x="25" y="400" width="320" height="105" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="185" y="430" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Quản trị</text><text x="185" y="458" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Dự án · tài khoản</text><text x="185" y="486" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Thiết bị · nhật ký</text><path d="M185,260 L185,400" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><rect x="390" y="400" width="320" height="105" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="550" y="430" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Bảng công việc</text><text x="550" y="458" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Bảng trạng thái</text><text x="550" y="486" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Quản lý kiểm thử</text><path d="M550,280 L550,400" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><rect x="755" y="400" width="320" height="135" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="915" y="430" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Tổng quan / thông tin</text><text x="915" y="458" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Thành viên / Note</text><text x="915" y="486" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Rules / sổ tay</text><text x="915" y="514" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Phân tích: PM / ADMIN</text><path d="M710,260 L920,400" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><rect x="390" y="660" width="320" height="100" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="550" y="690" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Feature → file → case</text><text x="550" y="718" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Status / phân công / Issue</text><path d="M550,505 L550,660" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><rect x="25" y="660" width="320" height="100" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="185" y="690" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Quản lý lỗi /issues</text><text x="185" y="718" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Bug khám phá không cần case</text><polyline points="390,225 365,225 365,610 185,610 185,660" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><text x="550" y="845" text-anchor="middle" font-family="Arial" font-size="20" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">/tests/* đã nghỉ; /progress còn là alias có kiểm quyền của /analysis.</text></svg>