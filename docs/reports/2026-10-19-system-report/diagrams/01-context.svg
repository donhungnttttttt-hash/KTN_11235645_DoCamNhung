<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650"><title>Ngữ cảnh hệ thống TMS</title><desc>AppEntry; FeatureController; AiProviderGateway; RedmineController. SHIFT/CAT là quy trình ngoài, không có tích hợp được chứng minh.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="370" y="230" width="360" height="170" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="550" y="260" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">TMS</text><text x="550" y="288" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Quản lý kiểm thử nội bộ</text><text x="550" y="316" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Dự án → Feature → file → case</text><rect x="30" y="40" width="280" height="105" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="170" y="70" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">ADMIN</text><text x="170" y="98" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Tài khoản, dự án, kho máy</text><rect x="400" y="40" width="300" height="105" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="550" y="70" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">PM</text><text x="550" y="98" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Điều phối và báo cáo</text><rect x="780" y="40" width="280" height="105" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="920" y="70" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">TESTER / DEV</text><text x="920" y="98" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Test hoặc xử lý Issue</text><path d="M170,145 L410,230" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><path d="M550,145 L550,230" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><path d="M920,145 L690,230" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><rect x="45" y="480" width="300" height="105" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="195" y="510" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Dịch vụ AI</text><text x="195" y="538" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">API / ChatGPT / Ollama</text><rect x="410" y="480" width="280" height="105" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="550" y="510" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Workbook Excel</text><text x="550" y="538" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Nhập và xuất tài liệu</text><rect x="760" y="480" width="300" height="105" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="910" y="510" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Redmine legacy</text><text x="910" y="538" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Adapter còn trong source</text><path d="M400,400 L200,480" stroke="#334155" stroke-width="2" fill="none"  /><text x="300" y="431" text-anchor="middle" font-family="Arial" font-size="18" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Ngữ cảnh / trả lời</text><path d="M550,400 L550,480" stroke="#334155" stroke-width="2" fill="none"  /><path d="M700,400 L900,480" stroke="#334155" stroke-width="2" fill="none" stroke-dasharray="7 5" /><text x="800" y="431" text-anchor="middle" font-family="Arial" font-size="18" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Endpoint còn mở</text></svg>