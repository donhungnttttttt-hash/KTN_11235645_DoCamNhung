<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="480" viewBox="0 0 1100 480"><title>Vòng Status trên giao diện</title><desc>ResultCycleButton và FeatureService.updateResult; C05. Không gọi đây là quy tắc cạnh chuyển bắt buộc ở backend.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="10" y="150" width="160" height="90" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="90" y="180" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Unexecuted</text><rect x="235" y="150" width="160" height="90" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="315" y="180" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">OK</text><rect x="460" y="150" width="160" height="90" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="540" y="180" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">NG</text><rect x="685" y="150" width="160" height="90" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="765" y="180" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">P</text><rect x="910" y="150" width="160" height="90" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="990" y="180" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">NA</text><path d="M170,195 L235,195" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><path d="M395,195 L460,195" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><path d="M620,195 L685,195" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><path d="M845,195 L910,195" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><polyline points="990,240 990,320 90,320 90,240" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><text x="550" y="350" text-anchor="middle" font-family="Arial" font-size="18" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Bấm tiếp theo</text><text x="550" y="70" text-anchor="middle" font-family="Arial" font-size="28" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Vòng bấm trên giao diện</text><text x="550" y="410" text-anchor="middle" font-family="Arial" font-size="20" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Backend nhận một giá trị hợp lệ trong tập năm trạng thái, có kiểm quyền và version.</text><text x="550" y="445" text-anchor="middle" font-family="Arial" font-size="20" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Không phải sơ đồ trạng thái Bug/QA; không biểu thị tự tạo Issue khi NG.</text></svg>