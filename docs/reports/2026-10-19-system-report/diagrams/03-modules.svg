<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="750" viewBox="0 0 1100 750"><title>Phân rã chức năng TMS</title><desc>Frontend AppRouter/AdminApp và controller inventory. Không coi workflow legacy là nhóm thao tác mới.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="350" y="20" width="400" height="70" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="550" y="50" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">TMS</text><rect x="50" y="160" width="450" height="100" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="275" y="190" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Quản trị</text><text x="275" y="218" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Tài khoản · dự án · kho máy</text><polyline points="550,90 550,210 500,210" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><rect x="600" y="160" width="450" height="100" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="825" y="190" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Kiểm thử</text><text x="825" y="218" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Feature · file · case · Status</text><polyline points="550,90 550,210 600,210" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="350" width="450" height="100" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="275" y="380" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Cộng tác</text><text x="275" y="408" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Bug / QA · Note · sổ tay</text><polyline points="550,90 550,400 500,400" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><rect x="600" y="350" width="450" height="100" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="825" y="380" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Tổng hợp</text><text x="825" y="408" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Tiến độ · Markdown</text><polyline points="550,90 550,400 600,400" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><rect x="50" y="540" width="450" height="100" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="275" y="570" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">AI</text><text x="275" y="598" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Chat riêng · cấu hình</text><polyline points="550,90 550,590 500,590" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><rect x="600" y="540" width="450" height="100" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="825" y="570" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Hạ tầng</text><text x="825" y="598" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Session · audit · migration</text><polyline points="550,90 550,590 600,590" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/></svg>