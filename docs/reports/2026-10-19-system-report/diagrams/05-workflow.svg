<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="880" viewBox="0 0 1100 880"><title>Quy trình phân công và ghi nhận kiểm thử</title><desc>Clarification C03/C05/C06/C07; AssignmentPlan; FeatureService. Không có start/end execution hoặc cấp máy cho Tester.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="10" y="10" width="360" height="850" fill="#f8fafc" stroke="#cbd5e1"/><text x="190" y="48" text-anchor="middle" font-family="Arial" font-size="24" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">PM / ADMIN</text><rect x="370" y="10" width="360" height="850" fill="#fff" stroke="#cbd5e1"/><text x="550" y="48" text-anchor="middle" font-family="Arial" font-size="24" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">TESTER</text><rect x="730" y="10" width="360" height="850" fill="#f8fafc" stroke="#cbd5e1"/><text x="910" y="48" text-anchor="middle" font-family="Arial" font-size="24" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">TMS</text><rect x="40" y="90" width="300" height="80" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="190" y="120" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Tạo Feature</text><text x="190" y="148" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Nhập file hợp lệ</text><rect x="40" y="270" width="300" height="80" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="190" y="300" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Phân công case</text><text x="190" y="328" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">cho Tester</text><rect x="400" y="190" width="300" height="80" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="550" y="220" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Hoặc tự nhận</text><text x="550" y="248" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">phạm vi của mình</text><rect x="760" y="270" width="300" height="100" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="910" y="300" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Kiểm quyền / version</text><text x="910" y="328" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Kiểm phạm vi</text><text x="910" y="356" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Từ chối nếu xung đột</text><path d="M190,170 L190,270" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><polyline points="340,130 550,130 550,190" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><polyline points="340,310 365,310 365,390 735,390 735,320 760,320" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><polyline points="700,230 910,230 910,270" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><rect x="760" y="450" width="300" height="80" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="910" y="480" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Lưu trách nhiệm</text><text x="910" y="508" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">và lịch sử</text><path d="M910,370 L910,450" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><text x="910" y="401" text-anchor="middle" font-family="Arial" font-size="18" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Hợp lệ</text><rect x="400" y="450" width="300" height="80" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="550" y="480" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Thực hiện kiểm thử</text><text x="550" y="508" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">và ghi Status</text><path d="M760,490 L700,490" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><rect x="760" y="620" width="300" height="80" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="910" y="650" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Lưu Status</text><text x="910" y="678" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Tổng hợp tiến độ</text><polyline points="700,510 725,510 725,660 760,660" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><rect x="400" y="620" width="300" height="80" rx="8" fill="#eef5f5" stroke="#334155" stroke-width="2"/><text x="550" y="650" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Tạo Bug / QA nếu cần</text><text x="550" y="678" text-anchor="middle" font-family="Arial" font-size="21" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">hoặc ghi chú kiểm tra lại</text><path d="M550,530 L550,620" stroke="#334155" stroke-width="2" fill="none"  marker-end="url(#arr)"/><text x="550" y="566" text-anchor="middle" font-family="Arial" font-size="18" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Tùy chọn</text><text x="550" y="785" text-anchor="middle" font-family="Arial" font-size="20" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Tiến độ dựa vào Status; không phụ thuộc việc có tạo Issue hay không.</text><text x="550" y="825" text-anchor="middle" font-family="Arial" font-size="19" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">Swimlane mô tả quy trình, không phải BPMN. Retest không là workflow mới.</text></svg>