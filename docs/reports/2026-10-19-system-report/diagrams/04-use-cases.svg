<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900"><title>Use Case tiêu biểu theo vai trò</title><desc>Actor/ellipse/system boundary UML, association không hướng. TESTER chỉ tự nhận ở ca phân công; ADMIN/PM còn quyền quản trị Issue theo ma trận. Hình chọn các ca tiêu biểu, không phải sơ đồ bao hết mọi quyền.</desc><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#334155"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="230" y="30" width="640" height="830" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="550" y="60" text-anchor="middle" font-family="Arial" font-size="25" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">TMS — các Use Case tiêu biểu</text><circle cx="110" cy="90" r="14" fill="white" stroke="#334155" stroke-width="2"/><path d="M110,104 v42 M86,120 h48 M110,146 l-22,32 M110,146 l22,32" fill="none" stroke="#334155" stroke-width="2"/><text x="110" y="208" text-anchor="middle" font-family="Arial" font-size="22" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">ADMIN</text><circle cx="110" cy="490" r="14" fill="white" stroke="#334155" stroke-width="2"/><path d="M110,504 v42 M86,520 h48 M110,546 l-22,32 M110,546 l22,32" fill="none" stroke="#334155" stroke-width="2"/><text x="110" y="608" text-anchor="middle" font-family="Arial" font-size="22" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">PM</text><circle cx="980" cy="130" r="14" fill="white" stroke="#334155" stroke-width="2"/><path d="M980,144 v42 M956,160 h48 M980,186 l-22,32 M980,186 l22,32" fill="none" stroke="#334155" stroke-width="2"/><text x="980" y="248" text-anchor="middle" font-family="Arial" font-size="22" fill="#111827" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">TESTER</text><circl