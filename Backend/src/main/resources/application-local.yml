# Diagnostics endpoints are enabled only in this local profile.
spring:
  config:
    # Maven runs from Backend; local secrets stay outside the packaged resources.
    import: "optional:file:${TMS_LOCAL_CONFIG_FILE:../.env.mysql.local}[.properties]"
  datasource:
    url: "${TMS_DB_URL:jdbc:mysql://${TMS_MYSQL_HOST:127.0.0.1}:${TMS_MYSQL_PORT:3307}/${TMS_DB_NAME:tms}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true&sslMode=DISABLED}"
  flyway:
    # Public demo accounts/data are installed only on local databases.
    locations: classpath:db/migration,classpath:db/demo
    url: ${spring.datasource.url}
    # A local database owner can run both the app and migrations. Explicit
    # separate credentials (as generated by the initializer) still take priority.
    user: ${TMS_MIGRATION_USER:${TMS_DB_USER}}
    password: ${TMS_MIGRATION_PASSWORD:${TMS_DB_PASSWORD}}
logging:
  level:
    org.hibernate.SQL: WARN
