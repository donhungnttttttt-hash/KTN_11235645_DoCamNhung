spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  application:
    name: syp-tms
  session:
    timeout: ${TMS_SESSION_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 * * * * *"
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${TMS_DB_URL}
    username: ${TMS_DB_USER}
    password: ${TMS_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  sql:
    init:
      mode: never
  flyway:
    url: ${TMS_DB_URL}
    user: ${TMS_MIGRATION_USER}
    password: ${TMS_MIGRATION_PASSWORD}
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
server:
  address: ${TMS_BIND_ADDRESS:127.0.0.1}
  port: ${TMS_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
tms:
  bootstrap:
    enabled: ${TMS_BOOTSTRAP_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
